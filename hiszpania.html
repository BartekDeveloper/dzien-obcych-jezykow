<!doctype html>
<html lang="pl" data-kraj="es" data-pawilon="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dzień Języków — Hiszpania</title>
  <meta name="description" content="Pawilon Hiszpanii: geografia, historia, święta, kuchnia, muzyka, zabytki, język i zwroty z lektorem. Quiz z 12 pytaniami." />
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <a class="skip-link" href="#tresc">Przejdź do treści</a>
  <header class="topbar">
    <div class="bar">
      <a class="brand" href="index.html"><span class="flagi" aria-hidden="true"><svg class="flaga-mini"><use href="icons.svg#i-flag-es"/></svg><svg class="flaga-mini"><use href="icons.svg#i-flag-mx"/></svg></span> Dzień Języków</a>
      <button type="button" class="narz" id="menu-btn" aria-expanded="false" aria-controls="nawigacja" hidden><svg class="ik" aria-hidden="true"><use href="icons.svg#i-menu"/></svg> Menu</button>
      <nav class="mainnav" id="nawigacja" aria-label="Nawigacja główna">
        <a href="index.html">Start</a>
        <a href="hiszpania.html"><svg class="flaga-mini" aria-hidden="true"><use href="icons.svg#i-flag-es"/></svg> Hiszpania</a>
        <a href="meksyk.html"><svg class="flaga-mini" aria-hidden="true"><use href="icons.svg#i-flag-mx"/></svg> Meksyk</a>
        <a href="gry.html"><svg class="ik" aria-hidden="true"><use href="icons.svg#i-quiz"/></svg> Strefa gier</a>
      </nav>
      <div class="tools" role="group" aria-label="Ułatwienia dostępu i udostępnianie">
        <button type="button" class="narz" id="w-ruch" aria-pressed="false" aria-label="Wyłącz animacje" title="Bez ruchu"><svg class="ik" aria-hidden="true"><use href="icons.svg#i-bez-ruchu"/></svg></button>
        <button type="button" class="narz" id="w-projektor" aria-pressed="false" aria-label="Tryb projektora: większy tekst" title="Tryb projektor">A+</button>
        <button type="button" class="narz" id="w-udostepnij" aria-label="Pokaż kod QR do wysłania klasie" title="QR / Wyślij klasie"><svg class="ik" aria-hidden="true"><use href="icons.svg#i-udostepnij"/></svg></button>
      </div>
    </div>
  </header>

  <section class="hero" aria-labelledby="tytul">
    <div class="hero-baner" aria-hidden="true"><img src="foto/es-mezquita.jpg" alt="" fetchpriority="high" /></div>
    <div class="hero-inner wrap hero-nakladka" id="p-hero"><h1 id="tytul">Hiszpania</h1></div>
    <svg class="papel" viewBox="0 0 1200 44" preserveAspectRatio="none" aria-hidden="true"><rect x="0" y="0" width="1200" height="6" fill="#211a13"/><polygon points="0,8 100,8 50,38" fill="#c1272d"/><polygon points="100,8 200,8 150,38" fill="#f1bf00"/><polygon points="200,8 300,8 250,38" fill="#c1272d"/><polygon points="300,8 400,8 350,38" fill="#f1bf00"/><polygon points="400,8 500,8 450,38" fill="#c1272d"/><polygon points="500,8 600,8 550,38" fill="#f1bf00"/><polygon points="600,8 700,8 650,38" fill="#c1272d"/><polygon points="700,8 800,8 750,38" fill="#f1bf00"/><polygon points="800,8 900,8 850,38" fill="#c1272d"/><polygon points="900,8 1000,8 950,38" fill="#f1bf00"/><polygon points="1000,8 1100,8 1050,38" fill="#c1272d"/><polygon points="1100,8 1200,8 1150,38" fill="#f1bf00"/></svg>
  </section>

  <main id="tresc" class="wrap">
    <section class="blok" aria-labelledby="h-spis"><div id="p-spis" class="reveal"></div></section>
    <section class="blok" id="geografia" aria-label="Geografia"><div id="p-geo" class="reveal"></div></section>
    <section class="blok" aria-label="Historia"><div id="p-historia" class="reveal"></div></section>
    <section class="blok" aria-label="Święta"><div id="p-swieta"></div></section>
    <section class="blok" aria-label="Kuchnia"><div id="p-kuchnia"></div></section>
    <section class="blok" aria-label="Muzyka"><div id="p-muzyka"></div></section>
    <section class="blok" aria-label="Zabytki"><div id="p-zabytki"></div></section>
    <section class="blok" aria-label="Język"><div id="p-jezyk" class="reveal"></div></section>
    <section class="blok" id="zwroty" aria-label="Zwroty"><div id="p-zwroty"></div></section>
    <section class="blok" id="quiz" aria-labelledby="h-quiz" tabindex="-1">
      <div id="p-quiz-naglowek"></div>
      <h2 id="h-quiz" class="sr-only">Quiz: Hiszpania</h2>
      <p class="lead rekord" id="p-quiz-rekord"></p>
      <div class="quiz">
        <div id="p-quiz"><p>Naciśnij start. Na każde pytanie masz 20 sekund.</p></div>
        <p class="sr-only" role="status" id="p-quiz-live"></p>
        <p><button type="button" class="btn accent" id="p-quiz-start">Start quizu</button>
        <a class="btn btn-ghost" href="meksyk.html">Teraz Meksyk</a></p>
      </div>
    </section>
  </main>

  <footer><div class="wrap">
    <p><b>Pawilon Hiszpanii.</b> Wróć na <a href="index.html">start</a>, odwiedź <a href="meksyk.html">Meksyk</a> albo idź do <a href="gry.html">Strefy Gier</a>.</p>
  </div></footer>

  <dialog id="udostepnij" aria-labelledby="ud-t">
    <h3 id="ud-t">Wyślij stronę klasie</h3>
    <img class="qr" id="ud-qr" src="" alt="Kod QR do tej strony" width="200" height="200" />
    <p><label for="ud-link">Link do strony:</label><input class="link" id="ud-link" readonly value="" /></p>
    <div class="wiersz">
      <button type="button" class="btn accent" id="ud-kopiuj">Kopiuj link</button>
      <button type="button" class="btn" id="ud-system">Udostępnij…</button>
      <form method="dialog"><button class="btn">Zamknij (Esc)</button></form>
    </div>
  </dialog>

  <script type="module" src="/src/js/kraj.js"></script>

  <button type="button" class="btn primary" id="do-gory" hidden><svg class="ik" aria-hidden="true"><use href="icons.svg#i-gora"/></svg> W górę</button>
</body>
</html>
